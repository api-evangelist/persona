asyncapi: '2.6.0'
id: 'urn:com:withpersona:webhooks'
info:
  title: Persona Webhooks
  version: '2025-12-08'
  description: |
    AsyncAPI description of Persona's webhook surface for identity verification,
    fraud prevention, and KYC events.

    Persona delivers webhook events as HTTP POST requests with JSON:API formatted
    payloads. Each request is authenticated with an HMAC-SHA256 signature carried
    in the `Persona-Signature` header.

    The signature header contains two comma-separated key-value pairs:

      * `t=<unix_timestamp>` - unix time the request was sent
      * `v1=<signature>`     - hex HMAC-SHA256 of `"<t>.<raw_request_body>"`
                               using the webhook secret as the key

    During secret rotation the header may contain two space-separated sets of
    these pairs; either signature is considered valid.

    Persona retries failed deliveries up to 7 additional times with exponential
    backoff (approximately 3, 64, 729, 4096, 15625, 46656, 117649 seconds) if it
    does not receive a 2xx response within 5 seconds. Retry context is exposed
    via the `Persona-Webhook-Attempts-Left`, `Persona-Webhook-Attempts-Made`,
    and `Persona-Webhook-First-Attempted-At` headers.

    Source documentation:
      * https://docs.withpersona.com/webhooks
      * https://docs.withpersona.com/events
      * https://docs.withpersona.com/webhooks-best-practices
      * https://docs.withpersona.com/quickstart-webhooks
  contact:
    name: Persona Support
    url: https://docs.withpersona.com/docs/support
  license:
    name: Proprietary
    url: https://withpersona.com/legal/terms-of-service
  termsOfService: https://withpersona.com/legal/terms-of-service

defaultContentType: application/json

tags:
  - name: account
    description: Account lifecycle events.
  - name: case
    description: Case management events.
  - name: connect
    description: Persona Connect share token events.
  - name: document
    description: Document verification events.
  - name: inquiry
    description: Inquiry lifecycle events.
  - name: inquiry-session
    description: Inquiry session events for individual device sessions.
  - name: report
    description: Report processing and match events.
  - name: selfie
    description: Selfie verification events.
  - name: transaction
    description: Transaction events.
  - name: verification
    description: Verification lifecycle events.

servers:
  subscriber:
    url: '{subscriberEndpoint}'
    protocol: https
    description: |
      The subscriber-controlled HTTPS endpoint registered in the Persona
      Dashboard (Integration > Webhooks) that receives event POST requests.
    variables:
      subscriberEndpoint:
        default: https://example.com/persona/webhooks
        description: Fully-qualified URL of the subscriber webhook receiver.
    security:
      - personaSignature: []

channels:
  /:
    description: |
      Single delivery channel for all Persona webhook events. The specific event
      type is carried in the `data.attributes.name` field of the payload.
    publish:
      operationId: receivePersonaWebhook
      summary: Persona webhook event delivery.
      description: |
        Persona POSTs an event to the subscriber endpoint. The body conforms to
        the JSON:API specification. Affected and related objects are included in
        the `data.attributes.payload` attribute and use the same schema as their
        API resource endpoints.
      bindings:
        http:
          type: request
          method: POST
          bindingVersion: '0.3.0'
      message:
        oneOf:
          - $ref: '#/components/messages/AccountCreated'
          - $ref: '#/components/messages/AccountRedacted'
          - $ref: '#/components/messages/AccountArchived'
          - $ref: '#/components/messages/AccountRestored'
          - $ref: '#/components/messages/AccountConsolidated'
          - $ref: '#/components/messages/AccountTagAdded'
          - $ref: '#/components/messages/AccountTagRemoved'
          - $ref: '#/components/messages/CaseCreated'
          - $ref: '#/components/messages/CaseAssigned'
          - $ref: '#/components/messages/CaseResolved'
          - $ref: '#/components/messages/CaseReopened'
          - $ref: '#/components/messages/CaseUpdated'
          - $ref: '#/components/messages/ConnectShareTokenOutboundCreated'
          - $ref: '#/components/messages/ConnectShareTokenOutboundRedeemed'
          - $ref: '#/components/messages/ConnectShareTokenInboundCreated'
          - $ref: '#/components/messages/ConnectShareTokenInboundRedeemed'
          - $ref: '#/components/messages/DocumentCreated'
          - $ref: '#/components/messages/DocumentSubmitted'
          - $ref: '#/components/messages/DocumentProcessed'
          - $ref: '#/components/messages/DocumentErrored'
          - $ref: '#/components/messages/InquiryCreated'
          - $ref: '#/components/messages/InquiryStarted'
          - $ref: '#/components/messages/InquiryExpired'
          - $ref: '#/components/messages/InquiryCompleted'
          - $ref: '#/components/messages/InquiryFailed'
          - $ref: '#/components/messages/InquiryMarkedForReview'
          - $ref: '#/components/messages/InquiryApproved'
          - $ref: '#/components/messages/InquiryDeclined'
          - $ref: '#/components/messages/InquiryTransitioned'
          - $ref: '#/components/messages/InquirySessionStarted'
          - $ref: '#/components/messages/InquirySessionExpired'
          - $ref: '#/components/messages/InquirySessionCanceled'
          - $ref: '#/components/messages/ReportAddressLookupReady'
          - $ref: '#/components/messages/ReportAddressLookupErrored'
          - $ref: '#/components/messages/ReportAdverseMediaMatched'
          - $ref: '#/components/messages/ReportAdverseMediaReady'
          - $ref: '#/components/messages/ReportAdverseMediaErrored'
          - $ref: '#/components/messages/ReportBusinessAdverseMediaMatched'
          - $ref: '#/components/messages/ReportBusinessAdverseMediaReady'
          - $ref: '#/components/messages/ReportBusinessAdverseMediaErrored'
          - $ref: '#/components/messages/ReportBusinessWatchlistReady'
          - $ref: '#/components/messages/ReportBusinessWatchlistMatched'
          - $ref: '#/components/messages/ReportBusinessWatchlistErrored'
          - $ref: '#/components/messages/ReportEmailAddressReady'
          - $ref: '#/components/messages/ReportEmailAddressErrored'
          - $ref: '#/components/messages/ReportPhoneNumberReady'
          - $ref: '#/components/messages/ReportPhoneNumberErrored'
          - $ref: '#/components/messages/ReportProfileReady'
          - $ref: '#/components/messages/ReportProfileErrored'
          - $ref: '#/components/messages/ReportPoliticallyExposedPersonMatched'
          - $ref: '#/components/messages/ReportPoliticallyExposedPersonReady'
          - $ref: '#/components/messages/ReportPoliticallyExposedPersonErrored'
          - $ref: '#/components/messages/ReportWatchlistMatched'
          - $ref: '#/components/messages/ReportWatchlistReady'
          - $ref: '#/components/messages/ReportWatchlistErrored'
          - $ref: '#/components/messages/SelfieCreated'
          - $ref: '#/components/messages/SelfieSubmitted'
          - $ref: '#/components/messages/SelfieProcessed'
          - $ref: '#/components/messages/SelfieErrored'
          - $ref: '#/components/messages/TransactionCreated'
          - $ref: '#/components/messages/TransactionRedacted'
          - $ref: '#/components/messages/TransactionStatusUpdated'
          - $ref: '#/components/messages/VerificationCreated'
          - $ref: '#/components/messages/VerificationSubmitted'
          - $ref: '#/components/messages/VerificationPassed'
          - $ref: '#/components/messages/VerificationFailed'
          - $ref: '#/components/messages/VerificationRequiresRetry'
          - $ref: '#/components/messages/VerificationCanceled'

components:
  securitySchemes:
    personaSignature:
      type: httpApiKey
      in: header
      name: Persona-Signature
      description: |
        HMAC-SHA256 signature header. Format:
        `t=<unix_timestamp>,v1=<hex_signature>`. The signature is computed by
        applying HMAC-SHA256 with the webhook secret as the key over the
        dot-separated string `"<t>.<raw_request_body>"` and hex-encoding the
        result. During secret rotation the header may contain two
        space-separated sets of `t=...,v1=...` pairs; either valid signature
        authenticates the request.

  messageTraits:
    PersonaWebhookHeaders:
      headers:
        type: object
        required:
          - Persona-Signature
          - Content-Type
        properties:
          Content-Type:
            type: string
            const: application/json
            description: Always `application/json`.
          Persona-Signature:
            type: string
            description: |
              HMAC-SHA256 signature in the form
              `t=<unix_timestamp>,v1=<hex_signature>`. During secret rotation,
              two space-separated `t=...,v1=...` pairs may be present.
            example: t=1764686826,v1=XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
          Persona-Webhook-Attempts-Left:
            type: string
            description: Number of delivery attempts remaining after this one.
            example: '7'
          Persona-Webhook-Attempts-Made:
            type: string
            description: Number of delivery attempts made so far, including this one.
            example: '1'
          Persona-Webhook-First-Attempted-At:
            type: string
            description: Unix timestamp of the first delivery attempt for this event.
            example: '1764686826'

  messages:
    AccountCreated:
      name: account.created
      title: Account created
      summary: Occurs whenever an account is created.
      tags:
        - name: account
      traits:
        - $ref: '#/components/messageTraits/PersonaWebhookHeaders'
      payload:
        $ref: '#/components/schemas/AccountEventEnvelope'
