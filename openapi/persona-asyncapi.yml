  schemas:
    EventId:
      type: string
      description: Persona event identifier (prefixed `evt_`).
      example: evt_XGuYWp7WuDzNxie5z16s7sGJ

    EventTimestamp:
      type: string
      format: date-time
      description: ISO 8601 timestamp the event was created in Persona.

    JsonApiResourceRef:
      type: object
      description: JSON:API resource linkage object referencing a related resource.
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string

    JsonApiIncludedResource:
      type: object
      description: |
        JSON:API included resource. Objects within the payload use the same
        schema as their corresponding Persona API resource endpoint.
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          type: object
          additionalProperties: true
        relationships:
          type: object
          additionalProperties: true

    EventEnvelopeBase:
      type: object
      description: |
        Common JSON:API event envelope used for all Persona webhook events.
        The specific event type is identified by `data.attributes.name`. The
        affected resource and related objects are nested under
        `data.attributes.payload`.
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - id
            - attributes
          properties:
            type:
              type: string
              const: event
            id:
              $ref: '#/components/schemas/EventId'
            attributes:
              type: object
              required:
                - name
                - payload
                - created-at
              properties:
                name:
                  type: string
                  description: The fully-qualified event name (for example `inquiry.approved`).
                created-at:
                  $ref: '#/components/schemas/EventTimestamp'
                payload:
                  type: object
                  description: JSON:API document containing the affected resource and any related resources.
                  required:
                    - data
                  properties:
                    data:
                      type: object
                      required:
                        - type
                        - id
                      properties:
                        type:
                          type: string
                        id:
                          type: string
                        attributes:
                          type: object
                          additionalProperties: true
                        relationships:
                          type: object
                          additionalProperties: true
                    included:
                      type: array
                      items:
                        $ref: '#/components/schemas/JsonApiIncludedResource'

    AccountEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          description: Event envelope whose primary payload resource is an `account`.

    CaseEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          description: Event envelope whose primary payload resource is a `case`.

    ConnectShareTokenEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          description: Event envelope whose primary payload resource is a Persona Connect share token.

    DocumentEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          description: Event envelope whose primary payload resource is a `document/*` resource.

    InquiryEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          description: Event envelope whose primary payload resource is an `inquiry`.

    InquirySessionEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          description: Event envelope whose primary payload resource is an `inquiry-session`.

    ReportEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          description: Event envelope whose primary payload resource is a `report/*` resource.

    SelfieEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          description: Event envelope whose primary payload resource is a `selfie/*` resource.

    TransactionEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          description: Event envelope whose primary payload resource is a `transaction`.

    VerificationEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          description: Event envelope whose primary payload resource is a `verification/*` resource.
