                          type: template
                      verifications:
                        data:
                          - id: ver_KnqQRXmxmtquRE65CHTzymhR
                            type: verification/driver-license
                          - id: ver_2aguhcwq66zcmqipmrqjxw68
                            type: verification/selfie
                  included:
                    - type: template
                      id: blu_biqYXr3aNfHuLeXUdJUNFNET
                      attributes:
                        name: 'Acme #1'
                    - type: verification/driver-license
                      id: ver_KnqQRXmxmtquRE65CHTzymhR
                      attributes:
