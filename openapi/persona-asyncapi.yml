                    id: inq_2CVZ4HyVg7qaboXz2PUHknAn
                    attributes:
                      status: approved
                      reference-id: null
                      created-at: '2019-09-09T22:40:56.000Z'
                      completed-at: '2019-09-09T22:44:51.000Z'
                      expired-at: null
                    relationships:
                      reports:
                        data: []
                      template:
                        data:
