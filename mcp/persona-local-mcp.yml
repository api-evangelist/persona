- name: create-a-connect-connection
  description: Creates a new Connection from your organization to a destination organization in the `pending`
    state. The destination organization must accept the connection before it transitions to `active`;
    share tokens cannot be redeemed through the connection until then. Connections cannot be deleted,
    but they can be deactivated and later reactivated to control access.
