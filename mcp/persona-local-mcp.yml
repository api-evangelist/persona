    Note that this endpoint aggregates inquiries across all inquiry template(s). See [Pagination](https://docs.withpersona.com/pagination)
    for more details about handling the response. Results are returned in reverse chronological order,
    with the most recently created objects first.'
- name: create-an-inquiry
  description: 'Creates a new inquiry with optional pre-filled attributes.


    See [Sessions](https://docs.withpersona.com/inquiry-sessions) for how to continue the inquiry in [Embedded
    Flow](https://docs.withpersona.com/embedded-flow) or [Hosted Flow](https://docs.withpersona.com/hosted-flow).'
- name: retrieve-an-inquiry
  description: 'Retrieves the details of an existing Inquiry.


    In the [Embedded Flow](https://docs.withpersona.com/embedded-flow), the `inquiry-id` is the first
    parameter of the onStart callback. In the [Hosted Flow](https://docs.withpersona.com/hosted-flow),
    the `inquiry-id` is a query parameter in the onComplete callback.


    Template information will be found in `data.relationships.inquiry-template` if the inquiry is a Dynamic
    Flow inquiry, and in `data.relationships.template` if the inquiry is a Legacy 2.0 inquiry. For more
    information, see [Dynamic Flow vs. Legacy Templates](https://docs.withpersona.com/inquiry-templates#dynamic-flow-vs-legacy-templates).'
- name: redact-an-inquiry
  description: 'Permanently deletes personally identifiable information (PII) for an Inquiry and all associated
    Verifications, Reports, or other Persona resources. The response indicates a successful redaction
    of the Inquiry. Redaction of the Inquiry''s associated child objects are done asynchronously and may
    take some time before all associated child objects are fully redacted. **This action cannot be undone**.


    This endpoint can be used to comply with privacy regulations such as GDPR / CCPA or to enforce data
    privacy.'
- name: update-an-inquiry
  description: 'Updates an existing Inquiry.


    Note that if you use webhooks, updates to inquiries that are not in progress can result in data getting
    out of sync. For example, updating a completed Inquiry will not cause your Inquiry completed webhook
    to retrigger.


    Inquiries represent a snapshot of data collected from an individual, so we generally do not recommend
    updating an Inquiry''s data after the Inquiry has been finalized.'
- name: inquiries-add-tag
  description: Adds a new tag to an Inquiry.
