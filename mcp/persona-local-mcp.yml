- name: redeem-share-token
  description: "Initiates redemption of a Share Token in one of two modes:\n\n- **Clone:** Omit `data.attributes.destination-id`\
    \ to create a new object from the source.\n  Inquiry and Verification Share Tokens can be cloned.\n\
    - **Hydrate:** Provide `data.attributes.destination-id` to import source data into an existing\n \
    \ object. Account, Transaction, and Inquiry Share Tokens can hydrate an existing Account,\n  Transaction,\
    \ or Inquiry.\n\nRedemption is asynchronous. A successful request returns the Share Token with a `pending`\n\
    status while Persona processes the import."
