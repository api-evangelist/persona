- name: import-an-account
  description: "Bulk import accounts by uploading a CSV file.\n\nEach row should be the details for a\
    \ new account. The columns we allow are:\n  - reference_id\n  - name_first\n  - name_middle\n  - name_last\n\
    \  - birthdate\n  - social_security_number\n  - tags"
- name: import-email-address-lists
  description: "Bulk import email address List Items by uploading a CSV file.\n\nEach row should be the\
    \ details for a new List Item. The columns we allow are:\n  - value\n  - match_type (either 'email_address'\
    \ or 'domain')\n\nA match_type of 'email_address' will need to match the entire email address of an\
    \ individual, while a match_type of 'domain' will match on the email address domain of an individual\
    \ (i.e. all email addresses with domain 'gmail.com')."
- name: import-geolocation-lists
  description: "Bulk import geolocation List Items by uploading a CSV file.\n\nEach row should be the\
    \ details for a new List Item. The columns we allow are:\n  - latitude\n  - longitude\n  - radius_meters"
- name: import-government-id-number-lists
  description: "Bulk import government ID number List Items by uploading a CSV file.\n\nEach row should\
    \ be the details for a new List Item. The columns we allow are:\n  - id_number\n  - id_class\n\nCommon\
    \ values for id_class include `pp` for passport and `dl` for driver license. Please contact us or\
    \ reach out to [support@withpersona.com](mailto:support@withpersona.com) if you need help getting\
    \ id_class values."
- name: import-ip-address-lists
  description: "Bulk import IP address List Items by uploading a CSV file.\n\nEach row should be the details\
    \ for a new List Item. The columns we allow are:\n  - value\n\nBoth IPv4 and IPv6 are supported."
- name: import-name-lists
  description: "Bulk import name List Items by uploading a CSV file.\n\nEach row should be the details\
    \ for a new list item. The columns we allow are:\n  - name_first\n  - name_last"
- name: import-phone-number-lists
  description: "Bulk import phone number List Items by uploading a CSV file.\n\nEach row should be the\
    \ details for a new list item. The columns we allow are:\n  - value"
- name: list-all-inquiries
