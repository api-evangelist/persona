- name: deactivate-a-connect-connection
  description: Deactivates a Connection. Either the source or destination organization may deactivate
    a connection that is currently `pending` or `active`. Deactivation prevents further access through
    the connection but maintains the connection record. Connections that are already `inactive` cannot
    be deactivated again.
- name: reactivate-a-connect-connection
  description: Reactivates an inactive Connection, returning it to the `pending` state. Only the source
    organization can reactivate a connection. Once reactivated, the destination organization must accept
    the connection again before it returns to the `active` state. Only inactive connections can be reactivated.
