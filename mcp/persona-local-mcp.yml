- name: search-accounts
  description: 'Search for accounts using a flexible query language.


    ## Search vs. List Endpoints


    The Search and List endpoints serve different purposes and have distinct performance characteristics.


    Use the **Search** endpoint (`POST /accounts/search`) when you need to perform complex queries with
    boolean logic (AND/OR/NOT), filter by custom fields or identifiers, or apply multiple conditions simultaneously.
    Search is optimized for flexible querying and is faster than paginating through all resources when
    looking for specific records.


    Use the **List** endpoint (`GET /accounts`) for simple listing with basic filters like reference ID.


    ## Data Freshness


    Do not use search for read-after-write flows because the data will not be immediately available to
    search.

    Under normal operating conditions, data is searchable within approximately 1 minute of creation or
    modification.

    Propagation of new or updated data could be delayed during an outage.

    For workflows that require immediate data availability after creating or updating an account, use
    the List Accounts endpoint instead.


    ### Searchable Attributes


    The following attributes can be used in query predicates:


    | Attribute | Description |

    |-----------|-------------|

    | `type` | Account type (e.g., `acttp_ABC123`) |

    | `status` | Account status (e.g., `actst_ABC123`) |

    | `created_at` | Account creation timestamp |

    | `updated_at` | Account last updated timestamp |

    | `identifiers.*` | Custom identifier (e.g., `identifiers.user_id`) |

    | `fields.*` | Custom account field (e.g., `fields.age`) |


    **Note:** Custom fields (`fields.*`) must be configured as searchable on the Account Type to be queryable.'
