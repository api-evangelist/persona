- name: search-inquiries
  description: 'Search for inquiries using a flexible query language.


    ## Search vs. List Endpoints


    The Search and List endpoints serve different purposes and have distinct performance characteristics.


    Use the **Search** endpoint (`POST /inquiries/search`) when you need to perform complex queries with
    boolean logic (AND/OR/NOT), filter on multiple statuses simultaneously, or apply multiple conditions
