naftiko: 1.0.0-alpha2
info:
  label: Persona API — Lists
  description: 'Persona API — Lists. 2 operations. Lead operation: List all Lists. Self-contained Naftiko capability covering
    one Persona business surface.'
  tags:
  - Persona
  - Lists
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PERSONA_API_KEY: PERSONA_API_KEY
capability:
  consumes:
  - type: http
    namespace: persona-lists
    baseUri: https://withpersona.com/api/v1
    description: Persona API — Lists business capability. Self-contained, no shared references.
    resources:
    - name: lists
      path: /lists
      operations:
      - name: listlists
        method: GET
        description: List all Lists
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createlist
        method: POST
        description: Create a List
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.PERSONA_API_KEY}}'
  exposes:
  - type: rest
    namespace: persona-lists-rest
    port: 8080
    description: REST adapter for Persona API — Lists. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/lists
      name: lists
      description: REST surface for lists.
      operations:
      - method: GET
        name: listlists
        description: List all Lists
        call: persona-lists.listlists
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createlist
        description: Create a List
        call: persona-lists.createlist
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: persona-lists-mcp
    port: 9090
    transport: http
    description: MCP adapter for Persona API — Lists. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-all-lists
      description: List all Lists
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: persona-lists.listlists
      outputParameters:
      - type: object
        mapping: $.
    - name: create-list
      description: Create a List
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: persona-lists.createlist
      outputParameters:
      - type: object
        mapping: $.
