naftiko: 1.0.0-alpha2
info:
  label: Persona API — Transactions
  description: 'Persona API — Transactions. 2 operations. Lead operation: List all Transactions. Self-contained Naftiko capability
    covering one Persona business surface.'
  tags:
  - Persona
  - Transactions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PERSONA_API_KEY: PERSONA_API_KEY
capability:
  consumes:
  - type: http
    namespace: persona-transactions
    baseUri: https://withpersona.com/api/v1
    description: Persona API — Transactions business capability. Self-contained, no shared references.
    resources:
    - name: transactions
      path: /transactions
      operations:
      - name: listtransactions
        method: GET
        description: List all Transactions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createtransaction
        method: POST
        description: Create a Transaction
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.PERSONA_API_KEY}}'
  exposes:
  - type: rest
    namespace: persona-transactions-rest
    port: 8080
    description: REST adapter for Persona API — Transactions. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/transactions
      name: transactions
      description: REST surface for transactions.
      operations:
      - method: GET
        name: listtransactions
        description: List all Transactions
        call: persona-transactions.listtransactions
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtransaction
        description: Create a Transaction
        call: persona-transactions.createtransaction
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: persona-transactions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Persona API — Transactions. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-all-transactions
      description: List all Transactions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: persona-transactions.listtransactions
      outputParameters:
      - type: object
        mapping: $.
    - name: create-transaction
      description: Create a Transaction
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: persona-transactions.createtransaction
      outputParameters:
      - type: object
        mapping: $.
